<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VDM - Alerta Procurado</title>

<style>

*{
    box-sizing:border-box;
}

body{
    background:#0d1117;
    color:#fff;
    font-family:Arial, sans-serif;
    margin:0;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    background:#161b22;
    padding:20px;
    border-radius:12px;
}

h1{
    text-align:center;
    color:#00d26a;
}

.row{
    display:flex;
    gap:10px;
}

.col{
    flex:1;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

input, textarea{
    width:100%;
    padding:10px;
    border:none;
    border-radius:6px;
    background:#21262d;
    color:white;
}

textarea{
    height:280px;
    resize:vertical;
}

button{
    background:#00d26a;
    border:none;
    color:white;
    padding:12px 18px;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
    margin-right:5px;
}

button:hover{
    opacity:0.9;
}

#status{
    margin-top:10px;
    font-weight:bold;
    color:#00d26a;
}

@media(max-width:700px){

.row{
    flex-direction:column;
}

}

</style>

</head>
<body>

<div class="container">

<h1>🚨 ALERTA - PROCURADO</h1>

<div class="row">

<div class="col">
<label>Nome</label>
<input type="text" id="nome">
</div>

<div class="col">
<label>CPF</label>
<input type="text" id="cpf">
</div>

</div>

<br>

<div class="row">

<div class="col">
<label>Mãe</label>
<input type="text" id="mae">
</div>

<div class="col">
<label>Data de Nascimento</label>
<input type="text" id="dn" placeholder="08/01/1970">
</div>

</div>

<br>

<div class="row">

<div class="col">
<label>Confiança (%)</label>
<input type="text" id="confianca" placeholder="96,27">
</div>

<div class="col">
<label>Data / Hora</label>
<input type="text" id="datahora">
</div>

</div>

<br>

<label>Link Google Maps / Street View</label>
<input type="text" id="mapsLink"
placeholder="Cole aqui o link do Google Maps">

<button onclick="buscarEndereco()">
📍 Buscar Endereço
</button>

<div id="status"></div>

<br>

<label>Endereço Encontrado</label>
<input type="text" id="endereco">

<br>

<button onclick="gerarTexto()">
📝 Gerar Texto
</button>

<button onclick="copiarTexto()">
📋 Copiar
</button>

<br><br>

<label>Texto Pronto para WhatsApp</label>

<textarea id="resultado"></textarea>

</div>

<script>

function extrairCoordenadas(url){

    const regexes = [

        /@(-?\d+\.\d+),(-?\d+\.\d+)/,

        /destination=(-?\d+\.\d+),(-?\d+\.\d+)/,

        /q=(-?\d+\.\d+),(-?\d+\.\d+)/,

        /ll=(-?\d+\.\d+),(-?\d+\.\d+)/,

        /(-?\d+\.\d+),\s*(-?\d+\.\d+)/
    ];

    for(const regex of regexes){

        const match = url.match(regex);

        if(match){

            return {
                lat: match[1],
                lon: match[2]
            };
        }
    }

    return null;
}

async function buscarEndereco(){

    const status = document.getElementById("status");
    status.innerHTML = "🔄 Consultando endereço...";

    const link = document.getElementById("mapsLink").value;

    const coords = extrairCoordenadas(link);

    if(!coords){

        status.innerHTML = "❌ Coordenadas não encontradas.";

        return;
    }

    try{

        const url =
        `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${coords.lat}&lon=${coords.lon}`;

        const resposta = await fetch(url,{
            headers:{
                "Accept":"application/json"
            }
        });

        const dados = await resposta.json();

        if(dados.display_name){

            document.getElementById("endereco").value =
            dados.display_name;

            status.innerHTML =
            "✅ Endereço localizado com sucesso.";

        }else{

            status.innerHTML =
            "❌ Endereço não encontrado.";

        }

    }
    catch(erro){

        console.error(erro);

        status.innerHTML =
        "❌ Erro ao consultar endereço.";

    }

}

function gerarTexto(){

    const nome =
    document.getElementById("nome").value;

    const cpf =
    document.getElementById("cpf").value;

    const mae =
    document.getElementById("mae").value;

    const dn =
    document.getElementById("dn").value;

    const endereco =
    document.getElementById("endereco").value;

    const confianca =
    document.getElementById("confianca").value;

    const datahora =
    document.getElementById("datahora").value;

    const maps =
    document.getElementById("mapsLink").value;

    const texto =

`🚨 ALERTA - PROCURADO

👤 ${nome}
CPF: ${cpf}
Mãe: ${mae}
DN: ${dn}

📍 ${endereco}

🗺️ ${maps}

📷 DSS | Confiança: ${confianca}%
🕒 ${datahora}

COPOM VDM EQ. B`;

    document.getElementById("resultado").value =
    texto;

}

async function copiarTexto(){

    const texto =
    document.getElementById("resultado").value;

    await navigator.clipboard.writeText(texto);

    alert("Texto copiado para a área de transferência.");

}

window.onload = function(){

    const agora = new Date();

    const data =
    agora.toLocaleDateString("pt-BR") +
    " " +
    agora.toLocaleTimeString("pt-BR");

    document.getElementById("datahora").value =
    data;

}

</script>

</body>
</html>
