<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VDM - Gerador de Alerta</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#0d1117;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    max-width:1000px;
    margin:auto;
    background:#161b22;
    padding:20px;
    border-radius:10px;
}

h1{
    text-align:center;
    color:#00d26a;
}

.row{
    display:flex;
    gap:10px;
}

.col{
    flex:1;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

input,
textarea{
    width:100%;
    padding:10px;
    border:none;
    border-radius:6px;
    background:#21262d;
    color:white;
}

textarea{
    height:320px;
    resize:vertical;
}

button{
    background:#00d26a;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
    margin-right:5px;
}

button:hover{
    opacity:.9;
}

#status{
    margin-top:10px;
    font-weight:bold;
    color:#00d26a;
}

@media(max-width:700px){

    .row{
        flex-direction:column;
    }

}

</style>

</head>

<body>

<div class="container">

<h1>🚨 ALERTA - PROCURADO</h1>

<div class="row">

<div class="col">
<label>Nome</label>
<input type="text" id="nome">
</div>

<div class="col">
<label>CPF</label>
<input type="text" id="cpf">
</div>

</div>

<br>

<div class="row">

<div class="col">
<label>Mãe</label>
<input type="text" id="mae">
</div>

<div class="col">
<label>Data de Nascimento</label>
<input type="text" id="dn">
</div>

</div>

<br>

<div class="row">

<div class="col">
<label>Confiança (%)</label>
<input type="text" id="confianca" value="96,00">
</div>

<div class="col">
<label>Data / Hora</label>
<input type="text" id="datahora">
</div>

</div>

<br>

<label>Link Google Maps</label>
<input
type="text"
id="mapsLink"
placeholder="Cole aqui o link completo do Google Maps">

<div id="status"></div>

<br>

<label>Endereço</label>
<input type="text" id="endereco">

<br>

<button onclick="gerarTexto()">
📝 Gerar Texto
</button>

<button onclick="copiarTexto()">
📋 Copiar
</button>

<br><br>

<label>Texto Pronto</label>

<textarea id="resultado"></textarea>

</div>

<script>

let latitude = "";
let longitude = "";

function extrairEndereco(url){

    try{

        const match =
        url.match(/maps\/place\/([^\/]+)/i);

        if(!match) return "";

        let endereco =
        decodeURIComponent(match[1]);

        endereco = endereco
            .replace(/\+/g," ")
            .replace(/,/g,", ")
            .replace(/-/g," ")
            .replace(/\s+/g," ")
            .trim();

        return endereco;

    }catch{

        return "";
    }

}

function extrairCoordenadas(url){

    const regexes = [

        /@(-?\d+\.\d+),(-?\d+\.\d+)/,

        /!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/,

        /destination=(-?\d+\.\d+),(-?\d+\.\d+)/,

        /q=(-?\d+\.\d+),(-?\d+\.\d+)/,

        /ll=(-?\d+\.\d+),(-?\d+\.\d+)/,

        /(-?\d+\.\d+),(-?\d+\.\d+)/

    ];

    for(const regex of regexes){

        const match = url.match(regex);

        if(match){

            latitude = match[1];
            longitude = match[2];

            return true;
        }

    }

    return false;

}

function processarLink(){

    const link =
    document.getElementById("mapsLink").value.trim();

    if(!link) return;

    const endereco =
    extrairEndereco(link);

    if(endereco){

        document.getElementById("endereco").value =
        endereco;

        document.getElementById("status").innerHTML =
        "✅ Endereço identificado automaticamente.";

    }

    extrairCoordenadas(link);

}

document
.getElementById("mapsLink")
.addEventListener("input",function(){

    clearTimeout(window.delay);

    window.delay =
    setTimeout(processarLink,500);

});

function gerarTexto(){

    const nome =
    document.getElementById("nome").value;

    const cpf =
    document.getElementById("cpf").value;

    const mae =
    document.getElementById("mae").value;

    const dn =
    document.getElementById("dn").value;

    const endereco =
    document.getElementById("endereco").value;

    const confianca =
    document.getElementById("confianca").value;

    const datahora =
    document.getElementById("datahora").value;

    let mapa = "";

    if(latitude && longitude){

        mapa =
        `https://maps.google.com/?q=${latitude},${longitude}`;

    }

    const texto =

`🚨 ALERTA - PROCURADO

👤 ${nome}
CPF: ${cpf}
Mãe: ${mae}
DN: ${dn}

📍 ${endereco}

🗺️ ${mapa}

📷 DSS | Confiança: ${confianca}%
🕒 ${datahora}

COPOM VDM EQ. B`;

    document.getElementById("resultado").value =
    texto;

}

async function copiarTexto(){

    const texto =
    document.getElementById("resultado").value;

    await navigator.clipboard.writeText(texto);

    alert("Texto copiado.");

}

window.onload = function(){

    const agora = new Date();

    document.getElementById("datahora").value =
    agora.toLocaleDateString("pt-BR")
    + " "
    + agora.toLocaleTimeString("pt-BR");

}

</script>

</body>
</html>
